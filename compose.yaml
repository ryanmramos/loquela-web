name: whatsanki

services:
  postgres:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whatsanki}
      POSTGRES_USER: ${POSTGRES_USER:-whatsanki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatsanki-local-only}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - whatsanki-private

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-whatsanki-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-whatsanki-local-password}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - whatsanki-private

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-whatsanki-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-whatsanki-local-password}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-whatsanki-local}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${OBJECT_STORE_BUCKET}"
        mc anonymous set none "local/$${OBJECT_STORE_BUCKET}"
    restart: "no"
    networks:
      - whatsanki-private

volumes:
  postgres-data:
  minio-data:

networks:
  whatsanki-private:
    driver: bridge

