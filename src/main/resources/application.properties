spring.application.name=WhatsAnki

# Load local development variables from the project-root .env file when present.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/whatsanki}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:whatsanki}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:whatsanki-local-only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

whatsanki.public-base-url=${WHATSANKI_PUBLIC_BASE_URL:http://localhost:8080}
whatsanki.data-encryption-key=${WHATSANKI_DATA_ENCRYPTION_KEY:}
whatsanki.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
whatsanki.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
whatsanki.twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:}
whatsanki.twilio.status-callback-url=${TWILIO_STATUS_CALLBACK_URL:}

whatsanki.ingestion.max-download-bytes=${WHATSANKI_MAX_DOWNLOAD_BYTES:15728640}
whatsanki.ingestion.max-extracted-characters=${WHATSANKI_MAX_EXTRACTED_CHARACTERS:2000000}
whatsanki.ingestion.max-pdf-pages=${WHATSANKI_MAX_PDF_PAGES:2000}
whatsanki.ingestion.max-epub-entries=${WHATSANKI_MAX_EPUB_ENTRIES:10000}
whatsanki.ingestion.extraction-timeout=${WHATSANKI_EXTRACTION_TIMEOUT:PT1M}

whatsanki.jobs.poll-interval=${WHATSANKI_JOBS_POLL_INTERVAL:PT1S}
whatsanki.jobs.lease-duration=${WHATSANKI_JOBS_LEASE_DURATION:PT5M}

whatsanki.object-store.endpoint=${OBJECT_STORE_ENDPOINT:http://localhost:9000}
whatsanki.object-store.region=${OBJECT_STORE_REGION:us-east-1}
whatsanki.object-store.bucket=${OBJECT_STORE_BUCKET:whatsanki-local}
whatsanki.object-store.access-key=${OBJECT_STORE_ACCESS_KEY:}
whatsanki.object-store.secret-key=${OBJECT_STORE_SECRET_KEY:}
whatsanki.object-store.path-style=${OBJECT_STORE_PATH_STYLE:true}

whatsanki.dictionary.provider=${DICTIONARY_PROVIDER:fake}
whatsanki.dictionary.base-url=${DICTIONARY_BASE_URL:}
whatsanki.dictionary.api-key=${DICTIONARY_API_KEY:}
whatsanki.dictionary.user-agent=${DICTIONARY_USER_AGENT:WhatsAnki/0.1}

whatsanki.retention.inbound-body=${WHATSANKI_RETENTION_INBOUND_BODY:P7D}
whatsanki.retention.original-document=${WHATSANKI_RETENTION_ORIGINAL_DOCUMENT:P30D}
whatsanki.retention.lookup-session=${WHATSANKI_RETENTION_LOOKUP_SESSION:PT30M}
whatsanki.retention.export-artifact=${WHATSANKI_RETENTION_EXPORT_ARTIFACT:PT24H}

whatsanki.languages.default-source=${WHATSANKI_DEFAULT_SOURCE_LANGUAGE:es}
whatsanki.languages.default-definition=${WHATSANKI_DEFAULT_DEFINITION_LANGUAGE:en}
whatsanki.languages.supported-pairs=${WHATSANKI_SUPPORTED_LANGUAGE_PAIRS:es:en,en:es}

# Logging: include the request correlation ID without logging request bodies or credentials.
logging.level.root=INFO
logging.level.com.example.whatsanki=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId:-no-correlation}] %logger{36} - %msg%n
