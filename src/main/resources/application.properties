spring.application.name=WhatsAnki
server.port=${PORT:8080}
whatsanki.release-id=${LOQUELA_RELEASE_ID:${RAILWAY_GIT_COMMIT_SHA:development}}

# Load local development variables from the project-root .env file when present.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/whatsanki}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:whatsanki}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:whatsanki-local-only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Expose only health probes. Details remain private, and readiness verifies the database
# without allowing transient Twilio or dictionary-provider outages to restart the API.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

whatsanki.public-base-url=${WHATSANKI_PUBLIC_BASE_URL:http://localhost:8080}
whatsanki.data-encryption-key=${WHATSANKI_DATA_ENCRYPTION_KEY:}
whatsanki.twilio.enabled=${WHATSANKI_TWILIO_ENABLED:true}
whatsanki.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
whatsanki.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
whatsanki.twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:}
whatsanki.twilio.status-callback-url=${TWILIO_STATUS_CALLBACK_URL:}
whatsanki.twilio.media-allowed-hosts=${TWILIO_MEDIA_ALLOWED_HOSTS:api.twilio.com}
whatsanki.twilio.media-redirect-allowed-hosts=${TWILIO_MEDIA_REDIRECT_ALLOWED_HOSTS:mms.twiliocdn.com}

whatsanki.security.google-oauth-enabled=${WHATSANKI_GOOGLE_OAUTH_ENABLED:false}
whatsanki.security.local-login-enabled=${WHATSANKI_LOCAL_LOGIN_ENABLED:false}
whatsanki.security.secure-cookies=${WHATSANKI_SECURE_COOKIES:false}
whatsanki.security.frontend-base-url=${WHATSANKI_FRONTEND_BASE_URL:http://localhost:4200}
whatsanki.security.session-timeout=${WHATSANKI_SESSION_TIMEOUT:PT8H}
whatsanki.security.allowed-origins=${WHATSANKI_ALLOWED_ORIGINS:}
whatsanki.security.bootstrap-admin-emails=${WHATSANKI_BOOTSTRAP_ADMIN_EMAILS:}
whatsanki.security.auth-requests-per-minute=${WHATSANKI_AUTH_REQUESTS_PER_MINUTE:30}
whatsanki.security.link-requests-per-minute=${WHATSANKI_LINK_REQUESTS_PER_MINUTE:20}

spring.session.jdbc.initialize-schema=never
spring.session.timeout=${WHATSANKI_SESSION_TIMEOUT:PT8H}
server.servlet.session.cookie.name=LOQUELA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${WHATSANKI_SECURE_COOKIES:false}
server.servlet.session.cookie.same-site=lax
spring.servlet.multipart.max-file-size=${WHATSANKI_MULTIPART_MAX_FILE_SIZE:15MB}
spring.servlet.multipart.max-request-size=${WHATSANKI_MULTIPART_MAX_REQUEST_SIZE:16MB}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false

whatsanki.ingestion.max-download-bytes=${WHATSANKI_MAX_DOWNLOAD_BYTES:15728640}
whatsanki.ingestion.max-extracted-characters=${WHATSANKI_MAX_EXTRACTED_CHARACTERS:2000000}
whatsanki.ingestion.max-pdf-pages=${WHATSANKI_MAX_PDF_PAGES:2000}
whatsanki.ingestion.max-epub-entries=${WHATSANKI_MAX_EPUB_ENTRIES:10000}
whatsanki.ingestion.max-passage-characters=${WHATSANKI_MAX_PASSAGE_CHARACTERS:1200}
whatsanki.ingestion.max-passage-tokens=${WHATSANKI_MAX_PASSAGE_TOKENS:250}
whatsanki.ingestion.max-passage-sentences=${WHATSANKI_MAX_PASSAGE_SENTENCES:3}
whatsanki.ingestion.extraction-timeout=${WHATSANKI_EXTRACTION_TIMEOUT:PT1M}
whatsanki.ingestion.media-connect-timeout=${WHATSANKI_MEDIA_CONNECT_TIMEOUT:PT10S}
whatsanki.ingestion.media-read-timeout=${WHATSANKI_MEDIA_READ_TIMEOUT:PT30S}
whatsanki.ingestion.extraction-threads=${WHATSANKI_EXTRACTION_THREADS:2}
whatsanki.ingestion.upload-intent-lifetime=${WHATSANKI_UPLOAD_INTENT_LIFETIME:PT15M}

whatsanki.jobs.poll-interval=${WHATSANKI_JOBS_POLL_INTERVAL:PT1S}
whatsanki.jobs.lease-duration=${WHATSANKI_JOBS_LEASE_DURATION:PT5M}
whatsanki.jobs.enabled=${WHATSANKI_JOBS_ENABLED:true}

whatsanki.jobs.batch-size=${WHATSANKI_JOBS_BATCH_SIZE:10}
whatsanki.jobs.default-max-attempts=${WHATSANKI_JOBS_DEFAULT_MAX_ATTEMPTS:3}
whatsanki.jobs.max-payload-bytes=${WHATSANKI_JOBS_MAX_PAYLOAD_BYTES:4096}
whatsanki.jobs.retry-base-delay=${WHATSANKI_JOBS_RETRY_BASE_DELAY:PT5S}
whatsanki.jobs.retry-max-delay=${WHATSANKI_JOBS_RETRY_MAX_DELAY:PT15M}

whatsanki.search.max-term-characters=${WHATSANKI_SEARCH_MAX_TERM_CHARACTERS:256}
whatsanki.search.max-results=${WHATSANKI_SEARCH_MAX_RESULTS:20}
whatsanki.search.candidate-multiplier=${WHATSANKI_SEARCH_CANDIDATE_MULTIPLIER:5}
whatsanki.search.max-candidates=${WHATSANKI_SEARCH_MAX_CANDIDATES:100}
whatsanki.search.ideal-passage-characters=${WHATSANKI_SEARCH_IDEAL_PASSAGE_CHARACTERS:320}
whatsanki.search.lookup-results=${WHATSANKI_SEARCH_LOOKUP_RESULTS:5}
whatsanki.search.lookup-max-results-per-source=${WHATSANKI_SEARCH_LOOKUP_MAX_RESULTS_PER_SOURCE:2}
whatsanki.search.max-dictionary-search-terms=${WHATSANKI_SEARCH_MAX_DICTIONARY_SEARCH_TERMS:32}

whatsanki.outbound.max-message-characters=${WHATSANKI_OUTBOUND_MAX_MESSAGE_CHARACTERS:1500}
whatsanki.outbound.max-lookup-parts=${WHATSANKI_OUTBOUND_MAX_LOOKUP_PARTS:10}

whatsanki.object-store.endpoint=${OBJECT_STORE_ENDPOINT:http://localhost:9000}
whatsanki.object-store.region=${OBJECT_STORE_REGION:us-east-1}
whatsanki.object-store.bucket=${OBJECT_STORE_BUCKET:whatsanki-local}
whatsanki.object-store.access-key=${OBJECT_STORE_ACCESS_KEY:}
whatsanki.object-store.secret-key=${OBJECT_STORE_SECRET_KEY:}
whatsanki.object-store.path-style=${OBJECT_STORE_PATH_STYLE:true}
whatsanki.object-store.presigned-url-lifetime=${OBJECT_STORE_PRESIGNED_URL_LIFETIME:PT15M}

whatsanki.dictionary.provider=${DICTIONARY_PROVIDER:fake}
# Comma-separated fallback order. Keep empty to select the single provider above.
whatsanki.dictionary.provider-order=${DICTIONARY_PROVIDER_ORDER:}
# Pair routes bind naturally from YAML/properties, e.g.
# whatsanki.dictionary.routes[es:es]=rae,wiktionary
whatsanki.dictionary.wiktionary-base-url-template=${DICTIONARY_WIKTIONARY_BASE_URL_TEMPLATE:https://{definitionLanguage}.wiktionary.org/w/api.php}
whatsanki.dictionary.wiktionary-allowed-hosts=${DICTIONARY_WIKTIONARY_ALLOWED_HOSTS:en.wiktionary.org,es.wiktionary.org}
whatsanki.dictionary.rae-base-url=${DICTIONARY_RAE_BASE_URL:https://rae-api.com}
whatsanki.dictionary.rae-allowed-hosts=${DICTIONARY_RAE_ALLOWED_HOSTS:rae-api.com}
whatsanki.dictionary.rae-api-key=${RAE_API_KEY:}
whatsanki.dictionary.connect-timeout=${DICTIONARY_CONNECT_TIMEOUT:PT3S}
whatsanki.dictionary.read-timeout=${DICTIONARY_READ_TIMEOUT:PT8S}
whatsanki.dictionary.max-response-bytes=${DICTIONARY_MAX_RESPONSE_BYTES:1048576}
whatsanki.dictionary.max-concurrent-requests=${DICTIONARY_MAX_CONCURRENT_REQUESTS:4}
whatsanki.dictionary.base-url=${DICTIONARY_BASE_URL:}
whatsanki.dictionary.api-key=${DICTIONARY_API_KEY:}
whatsanki.dictionary.user-agent=${DICTIONARY_USER_AGENT:WhatsAnki/0.1 (contact: you@example.com)}

whatsanki.exporter.python-executable=${WHATSANKI_EXPORTER_PYTHON_EXECUTABLE:python3}
whatsanki.exporter.module=${WHATSANKI_EXPORTER_MODULE:whatsanki_exporter}
whatsanki.exporter.working-directory=${WHATSANKI_EXPORTER_WORKING_DIRECTORY:exporter}
whatsanki.exporter.timeout=${WHATSANKI_EXPORTER_TIMEOUT:PT2M}
whatsanki.exporter.max-artifact-bytes=${WHATSANKI_EXPORTER_MAX_ARTIFACT_BYTES:104857600}

whatsanki.retention.inbound-body=${WHATSANKI_RETENTION_INBOUND_BODY:P7D}
whatsanki.retention.original-document=${WHATSANKI_RETENTION_ORIGINAL_DOCUMENT:P30D}
whatsanki.retention.lookup-session=${WHATSANKI_RETENTION_LOOKUP_SESSION:PT30M}
whatsanki.retention.export-artifact=${WHATSANKI_RETENTION_EXPORT_ARTIFACT:PT24H}
whatsanki.retention.scan-interval=${WHATSANKI_RETENTION_SCAN_INTERVAL:PT1H}
whatsanki.retention.scan-batch-size=${WHATSANKI_RETENTION_SCAN_BATCH_SIZE:100}

# Account deletion requires a second WhatsApp message containing the short-lived code.
whatsanki.account-deletion.confirmation-lifetime=${WHATSANKI_ACCOUNT_DELETION_CONFIRMATION_LIFETIME:PT10M}

whatsanki.youtube.enabled=${WHATSANKI_YOUTUBE_ENABLED:true}
whatsanki.youtube.executable=${WHATSANKI_YOUTUBE_EXECUTABLE:yt-dlp}
whatsanki.youtube.expected-version=${WHATSANKI_YOUTUBE_EXPECTED_VERSION:}
whatsanki.youtube.automatic-caption-fallback=${WHATSANKI_YOUTUBE_AUTOMATIC_CAPTION_FALLBACK:true}
whatsanki.youtube.process-timeout=${WHATSANKI_YOUTUBE_PROCESS_TIMEOUT:PT1M}
whatsanki.youtube.max-metadata-bytes=${WHATSANKI_YOUTUBE_MAX_METADATA_BYTES:1048576}
whatsanki.youtube.max-subtitle-bytes=${WHATSANKI_YOUTUBE_MAX_SUBTITLE_BYTES:5242880}
whatsanki.youtube.max-captured-error-bytes=${WHATSANKI_YOUTUBE_MAX_CAPTURED_ERROR_BYTES:16384}
whatsanki.youtube.max-caption-cues=${WHATSANKI_YOUTUBE_MAX_CAPTION_CUES:50000}
whatsanki.youtube.playback-lead=${WHATSANKI_YOUTUBE_PLAYBACK_LEAD:PT3S}

whatsanki.languages.default-source=${WHATSANKI_DEFAULT_SOURCE_LANGUAGE:es}
whatsanki.languages.default-definition=${WHATSANKI_DEFAULT_DEFINITION_LANGUAGE:en}
whatsanki.languages.supported-pairs=${WHATSANKI_SUPPORTED_LANGUAGE_PAIRS:es:en,en:es,es:es,en:en}

# Anonymous demo is intentionally disabled by default. All state remains process-local.
whatsanki.demo.enabled=${WHATSANKI_DEMO_ENABLED:false}
whatsanki.demo.ingestion-enabled=${WHATSANKI_DEMO_INGESTION_ENABLED:true}
whatsanki.demo.inactivity-timeout=${WHATSANKI_DEMO_INACTIVITY_TIMEOUT:PT2H}
whatsanki.demo.absolute-lifetime=${WHATSANKI_DEMO_ABSOLUTE_LIFETIME:PT8H}
whatsanki.demo.max-workspaces=${WHATSANKI_DEMO_MAX_WORKSPACES:100}
whatsanki.demo.ingestion-workers=${WHATSANKI_DEMO_INGESTION_WORKERS:1}
whatsanki.demo.ingestion-queue-capacity=${WHATSANKI_DEMO_INGESTION_QUEUE_CAPACITY:8}
whatsanki.demo.pdf-max-bytes=${WHATSANKI_DEMO_PDF_MAX_BYTES:5242880}
whatsanki.demo.pdf-max-pages=${WHATSANKI_DEMO_PDF_MAX_PAGES:100}
whatsanki.demo.pdf-max-extracted-characters=${WHATSANKI_DEMO_PDF_MAX_EXTRACTED_CHARACTERS:100000}
whatsanki.demo.youtube-max-duration=${WHATSANKI_DEMO_YOUTUBE_MAX_DURATION:PT30M}
whatsanki.demo.pasted-text-max-characters=${WHATSANKI_DEMO_PASTED_TEXT_MAX_CHARACTERS:20000}
whatsanki.demo.workspace-max-indexed-characters=${WHATSANKI_DEMO_WORKSPACE_MAX_INDEXED_CHARACTERS:250000}
whatsanki.demo.max-unique-lookups=${WHATSANKI_DEMO_MAX_UNIQUE_LOOKUPS:50}
whatsanki.demo.lookup-burst-per-minute=${WHATSANKI_DEMO_LOOKUP_BURST_PER_MINUTE:10}
whatsanki.demo.max-cards=${WHATSANKI_DEMO_MAX_CARDS:20}
whatsanki.demo.max-export-generations=${WHATSANKI_DEMO_MAX_EXPORT_GENERATIONS:10}
whatsanki.demo.export-generations-per-ip-minute=${WHATSANKI_DEMO_EXPORT_GENERATIONS_PER_IP_MINUTE:2}
whatsanki.demo.sessions-per-ip-hour=${WHATSANKI_DEMO_SESSIONS_PER_IP_HOUR:5}
whatsanki.demo.ingestions-per-ip-hour=${WHATSANKI_DEMO_INGESTIONS_PER_IP_HOUR:10}

# Logging: include the request correlation ID without logging request bodies or credentials.
logging.level.root=INFO
logging.level.com.example.whatsanki=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId:-no-correlation}] %logger{36} - %msg%n
