whatsanki.public-base-url=http://localhost:8080
whatsanki.data-encryption-key=test-only-encryption-key
whatsanki.dictionary.provider=fake
# Keep tests deterministic even when a developer's imported .env enables live routing.
whatsanki.dictionary.provider-order=
whatsanki.object-store.endpoint=http://localhost:9000
whatsanki.languages.default-source=es
whatsanki.languages.default-definition=en
whatsanki.languages.supported-pairs=es:en,en:es,es:es,en:en
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.clean-disabled=false
whatsanki.jobs.enabled=false
whatsanki.security.local-login-enabled=true
# CI deliberately has no developer .env file. Provide inert registration values so Spring creates
# the OAuth client repository needed by the browser security chain; no test calls Google.
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
