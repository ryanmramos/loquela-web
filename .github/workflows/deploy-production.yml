name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Approved Railway deployment
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.loquela.study
    env:
      RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Require the approved commit to remain main HEAD
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$APPROVED_SHA"
      - name: Verify Railway deployment helper
        run: PYTHONPATH=tools python -m unittest tools/test_railway_deploy.py
      - name: Run one-shot Flyway migration
        run: >-
          python tools/railway_deploy.py
          --service "${{ vars.RAILWAY_MIGRATION_SERVICE_ID }}"
          --commit "${{ github.event.workflow_run.head_sha }}"
      - name: Deploy private Spring service
        run: >-
          python tools/railway_deploy.py
          --service "${{ vars.RAILWAY_API_SERVICE_ID }}"
          --commit "${{ github.event.workflow_run.head_sha }}"
      - name: Deploy public Caddy/Angular service
        run: >-
          python tools/railway_deploy.py
          --service "${{ vars.RAILWAY_EDGE_SERVICE_ID }}"
          --commit "${{ github.event.workflow_run.head_sha }}"
      - name: Automated production smoke
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          curl --fail --show-error --silent --retry 6 --retry-delay 5 https://app.loquela.study/health/live
          curl --fail --show-error --silent --retry 6 --retry-delay 5 https://app.loquela.study/health/ready
          test "$(curl --fail --show-error --silent https://app.loquela.study/config.json | jq -r .releaseId)" = "$APPROVED_SHA"
          test "$(curl --fail --show-error --silent https://app.loquela.study/config.json | jq -r .primeUiLicenseKey | wc -c)" -gt 1
          curl --fail --show-error --silent https://app.loquela.study/ > /dev/null
