name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "openapi/**"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "openapi/**"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: >-
          ./mvnw
          -Dtest=BrowserOpenApiContractIntegrationTest,BrowserSecurityIntegrationTest,BrowserGoogleOAuthConfigurationIntegrationTest
          test
        working-directory: ${{ github.workspace }}
      - run: npm run lint
      - run: npm run format:check
      - run: npm run architecture:check
      - run: npm run api:check
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npm run proxy:check
      - run: npm run audit:dependencies
      - run: npm run licenses:check

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
