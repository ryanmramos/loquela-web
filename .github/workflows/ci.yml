name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B test
      - run: ./mvnw -B org.owasp:dependency-check-maven:12.2.2:check
      - run: PYTHONPATH=tools python -m unittest tools/test_railway_deploy.py

  exporter:
    name: Python exporter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: exporter/pyproject.toml
      - run: python -m pip install ./exporter pytest
      - run: python -m pytest exporter/tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run audit:dependencies
      - run: npm run licenses:check

  integrated:
    name: Integrated browser/API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: >-
          ./mvnw -B
          -Dtest=BrowserOpenApiContractIntegrationTest,BrowserSecurityIntegrationTest,BrowserGoogleOAuthConfigurationIntegrationTest
          test
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e:smoke
        working-directory: frontend
        env:
          PRIMEUI_LICENSE_KEY: ${{ secrets.PRIMEUI_LICENSE_KEY }}
      - name: Upload Playwright failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  containers:
    name: Production containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build backend image
        run: docker build --tag loquela-api:${{ github.sha }} .
      - name: Build edge image
        run: >-
          docker build
          --file frontend/Dockerfile
          --build-arg RELEASE_ID=${{ github.sha }}
          --tag loquela-edge:${{ github.sha }}
          .
      - name: Backend container canaries
        run: |
          test "$(docker run --rm --entrypoint id loquela-api:${{ github.sha }} -u)" = "10001"
          test "$(docker run --rm --entrypoint /opt/loquela/python/bin/yt-dlp loquela-api:${{ github.sha }} --version)" = "2026.07.04"
          docker run --rm --entrypoint /opt/loquela/python/bin/python loquela-api:${{ github.sha }} \
            -c "import genanki, whatsanki_exporter"
      - name: Edge configuration canary
        run: >-
          docker run --rm --entrypoint caddy loquela-edge:${{ github.sha }}
          validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: loquela-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
          version: v0.73.0
      - name: Scan edge image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: loquela-edge:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
          version: v0.73.0

  publish-images:
    name: Retain private GHCR evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, exporter, frontend, integrated, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/loquela-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          build-args: RELEASE_ID=${{ github.sha }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/loquela-edge:${{ github.sha }}
