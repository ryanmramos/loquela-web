{{#Recall}}
{{#Definition}}
<div class="wa-shell"><main class="wa-card wa-recall-card">
  <header class="wa-header"><div class="wa-source"><span class="wa-dot"></span><span class="wa-source-text">Future recall mode</span></div><span>{{LanguagePair}}</span></header>
  <section class="wa-recall-prompt"><p class="wa-label">Produce the target word</p><p class="wa-meaning" dir="auto">{{Definition}}</p><p class="wa-cloze" dir="auto">{{ContextBefore}}<span class="wa-blank">&nbsp;</span>{{ContextAfter}}</p><div class="wa-type-answer">{{type:Term}}</div></section>
  <footer class="wa-footer"><span>Say or type the answer</span><span>Then reveal</span></footer>
</main></div>
{{/Definition}}
{{/Recall}}
