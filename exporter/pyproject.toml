[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsanki-exporter"
version = "0.1.0"
description = "Isolated WhatsAnki .apkg exporter"
requires-python = ">=3.11"
dependencies = ["genanki==0.13.1"]

[tool.setuptools.package-data]
whatsanki_exporter = ["templates/whatsanki-context-v1/**/*.html", "templates/whatsanki-context-v1/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
