<section
  class="state"
  [attr.aria-live]="kind() === 'loading' ? 'polite' : null"
  [attr.aria-busy]="kind() === 'loading' ? 'true' : null"
>
  <div class="state__mark" [class.state__mark--error]="kind() === 'error'" aria-hidden="true">
    @switch (kind()) {
      @case ('loading') {
        <p-progress-spinner styleClass="state__spinner" [strokeWidth]="5" [ariaLabel]="title()" />
      }
      @case ('empty') {
        <app-icon name="book" [size]="30" />
      }
      @case ('error') {
        <app-icon name="danger" [size]="30" />
      }
    }
  </div>
  <h2>{{ title() }}</h2>
  <p>{{ description() }}</p>
  <div class="state__actions"><ng-content /></div>
</section>
