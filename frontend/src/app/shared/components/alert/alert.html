<section
  class="alert"
  [class]="'alert alert--' + tone()"
  [attr.aria-live]="live()"
  [attr.role]="tone() === 'danger' ? 'alert' : 'status'"
>
  <span class="alert__mark" aria-hidden="true">!</span>
  <div>
    <strong>{{ title() }}</strong>
    <div class="alert__body"><ng-content /></div>
  </div>
</section>
