<div class="searchable-select" (focusout)="handleFocusOut($event)">
  <label [for]="listboxId + '-input'">{{ label() }}</label>
  <input
    [id]="listboxId + '-input'"
    type="text"
    role="combobox"
    autocomplete="off"
    aria-autocomplete="list"
    [attr.aria-controls]="listboxId"
    [attr.aria-expanded]="open()"
    [attr.aria-activedescendant]="activeOptionId()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [value]="query()"
    (focus)="handleFocus()"
    (input)="handleInputEvent($event)"
    (keydown)="handleKeydown($event)"
  />
  @if (open()) {
    <div [id]="listboxId" class="searchable-select__listbox" role="listbox">
      @for (option of options(); track option.value; let index = $index) {
        <button
          [id]="listboxId + '-option-' + index"
          type="button"
          role="option"
          [attr.aria-selected]="selectedValue() === option.value"
          [class.searchable-select__option--active]="activeIndex() === index"
          (pointerdown)="$event.preventDefault()"
          (click)="select(option)"
        >
          {{ option.label }}
        </button>
      } @empty {
        <p class="searchable-select__empty">{{ emptyLabel() }}</p>
      }
    </div>
  }
</div>
