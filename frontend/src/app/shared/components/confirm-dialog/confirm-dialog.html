<section class="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
  <p class="eyebrow">Please confirm</p>
  <h2 id="dialog-title">{{ data.title }}</h2>
  <p id="dialog-description">{{ data.description }}</p>
  <div class="dialog__actions">
    <button appButton variant="secondary" type="button" (click)="close(false)">Cancel</button>
    <button appButton variant="danger" type="button" (click)="close(true)">
      {{ data.confirmLabel }}
    </button>
  </div>
</section>
