<nav class="pagination" [attr.aria-label]="'common.pagination' | translate">
  <button
    appButton
    variant="secondary"
    type="button"
    [disabled]="!canGoBack()"
    (click)="goTo(currentPage() - 1)"
  >
    {{ 'common.previous' | translate }}
  </button>
  <p aria-live="polite">
    {{ 'common.pageOf' | translate: { page: currentPage(), total: totalPages() } }}
  </p>
  <button
    appButton
    variant="secondary"
    type="button"
    [disabled]="!canGoForward()"
    (click)="goTo(currentPage() + 1)"
  >
    {{ 'common.next' | translate }}
  </button>
</nav>
